# 事件日历的定时抓取任务。
#
# 已启用（2026-10-30）：.github/workflows/calendar.yml 已在仓库中，
# 每 6 小时自动抓取一次，也可在 Actions 页手动 workflow_dispatch。
# 本文件是同一份工作流的备份/说明，改动时两边同步。
#
# 历史：原 token 只有 repo 权限，而 GitHub 对 workflow 文件额外要求 workflow scope
# （否则 API 创建返回 404），2026-10-30 补上 workflow scope 后正式推送启用。

name: refresh-calendar

# ForexFactory 周历不返回 CORS 头，浏览器端取不到，只能服务端抓完落成同源静态文件。
# 每 6 小时一次；schedule 不保证准点（高峰会延迟十几分钟），页面侧另有过期判定。
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch calendar
        run: python3 tools/fetch_calendar.py

      - name: Commit if changed
        run: |
          git config user.name  "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add calendar.json
          if git diff --quiet --cached; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh calendar"
          git push
