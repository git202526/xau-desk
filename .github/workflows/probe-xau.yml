name: probe xau sources

# 一次性探测：沙箱出口对 Yahoo / Stooq / Dukascopy 全不可达，不能据此判定源不可用。
# 本工作流在 runner 的正常公网下逐个试，结果写 xau/*.json，供选源决策使用。
# 触发方式：推送本文件或 tools/probe_xau*.py 即自动跑一次（也可手动 dispatch）。

on:
  push:
    paths:
      - "tools/probe_xau.py"
      - "tools/probe_xau2.py"
      - "tools/probe_xau3.py"
      - ".github/workflows/probe-xau.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-xau
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 第三轮（Dukascopy 周期与休市）
        run: python3 tools/probe_xau3.py

      - name: 回写结果
        run: |
          git config user.name  "xau-probe-bot"
          git config user.email "bot@users.noreply.github.com"
          git add xau/
          if git diff --cached --quiet; then
            echo "无变化"
            exit 0
          fi
          git commit -m "chore: xau source probe $(date -u +'%m-%d %H:%M')"
          for i in 1 2 3; do
            if git push; then echo "push ok"; break; fi
            git pull --rebase --autostash || true
          done
