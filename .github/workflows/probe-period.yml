name: probe-period
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 探测粗粒度文件
        run: python3 tools/probe_period.py
      - name: 回写结果
        run: |
          git config user.name  "xau-bot"
          git config user.email "xau-bot@users.noreply.github.com"
          git add xau/probe_period.json
          git commit -m "chore: probe period $(date -u +%m-%dT%H:%M)" || echo "no change"
          git pull --rebase origin main
          git push origin main
