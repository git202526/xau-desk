name: jin10 relay

# 为什么要中转：J2 实测 mcp.jin10.com 的 CORS 不放行（预检无 Access-Control-*，
# 带 Origin 的 POST 被 403 拒），浏览器直连不可能成功，只能服务端拉、落成同源静态文件。
#
# 为什么是 20 分钟：v6.58 起只抓日历，脚本 TTL 是 1080s。按 5 分钟跑，
# 每 4 次里有 3 次在 TTL 命中后直接退出 —— 白烧 3/4 的 Actions 分钟数。
# TTL 比 cron 短 2 分钟，是为了吸收 GitHub 定时任务的触发延迟：两者相等时，
# 晚触发的那一轮会撞上缓存，白跑。若将来恢复更频繁的抓取，这个 cron 要一起改。
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jin10-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 拉取金十数据（无 token 自动跳过）
        env:
          JIN10_TOKEN: ${{ secrets.JIN10_TOKEN }}
        run: |
          if [ -z "$JIN10_TOKEN" ]; then
            echo "::warning::未配置 secrets.JIN10_TOKEN，本次跳过（不发起请求）"
            exit 0
          fi
          python3 tools/fetch_jin10.py

      - name: 提交产物
        run: |
          git config user.name  "xau-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add jin10/ || true
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore: jin10 relay $(date -u +'%H:%M')"
            git push
          fi
