name: xau klines

# 抓 Dukascopy 的 XAU/USD 分钟线，清洗聚合后落 xau/klines.json。
#
# 为什么是 15 分钟：日线/4H 都不需要更密；每次只抓最近 4 天（覆盖当天 + 前一交易日）。
# 首次回填用 workflow_dispatch 手动跑 days=100，跑完若 window.failed 非空，再跑一次 retry=1。
#
# 为什么并发 4 + 补漏轮：实测 Dukascopy 对 Azure 出口有抖动，100 天首轮 46 天失败；
# 只并发不补漏会把缺日变成图上的「假断层」，与真实周末缺口混在一起。

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "回填天数（首次填 100，日常填 4）"
        required: false
        default: "4"
      retry:
        description: "只补上次失败的日期（1=是）"
        required: false
        default: "0"
      rebuild:
        description: "重建日线/周线（1=是，口径变更后跑一次）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: xau-klines
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取并聚合
        run: |
          DAYS="${{ github.event.inputs.days }}"
          RETRY="${{ github.event.inputs.retry }}"
          if [ -z "$DAYS" ]; then DAYS=4; fi
          REBUILD="${{ github.event.inputs.rebuild }}"
          if [ "$RETRY" = "1" ]; then
            python3 tools/fetch_xau.py --retry-failed
          elif [ "$REBUILD" = "1" ]; then
            python3 tools/fetch_xau.py --days "$DAYS" --rebuild-daily
          else
            python3 tools/fetch_xau.py --days "$DAYS"
          fi

      - name: 回写产物
        run: |
          git config user.name  "xau-klines-bot"
          git config user.email "bot@users.noreply.github.com"
          git add xau/klines.json
          if git diff --cached --quiet; then
            echo "无变化"
            exit 0
          fi
          git commit -m "chore: xau klines $(date -u +'%m-%d %H:%M')"
          for i in 1 2 3; do
            if git push; then echo "push ok"; break; fi
            git pull --rebase --autostash || true
          done
