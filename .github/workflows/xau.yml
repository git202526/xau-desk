name: xau klines

# 抓 Dukascopy 的 XAU/USD 分钟线，清洗聚合后落 xau/klines.json。
#
# v7.11 为什么改成长任务循环：
#   线上实测 schedule 被大幅丢弃 —— cron 写的是 */30（理论 48 次/天），
#   实际触发间隔 5.8 / 8.8 / 7.2 / 6.5 / 7.8 小时（见 2026-11-10 → 11-12 记录）。
#   数据再怎么写实，一天只跑三次也压不住滞后（用户现场 11 小时）。
#   所以改成「一次触发跑 10 轮，每轮间隔 30 分钟」：单次覆盖 5 小时，一天命中
#   5 次 schedule 就能铺满 24 小时；命中不足时空窗由下一次的首轮补齐（tick 回看
#   24 小时，能把空窗整段填回来）。
#
# 为什么后续轮次用 --ticks-only：
#   T+1 的日文件一小时重抓一次是白烧请求（同一份内容），tick 才是 T+0 的来源。
#   首轮 --days 3 抓日文件（顺便补失败的日期），其后 5 轮只拉最近 36 小时 tick。
#
# 为什么仍然保留 */30 的 cron：
#   GitHub 对公共仓库的 schedule 是「尽力而为」，命中率不可控。多写几个表达式
#   不会提高命中率，真正兜底的是长任务 + concurrency 排队接力。

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "回填天数（首次填 100，日常填 3）"
        required: false
        default: "3"
      retry:
        description: "只补上次失败的日期（1=是）"
        required: false
        default: "0"
      rebuild:
        description: "重建日线/周线（1=是，口径变更后跑一次）"
        required: false
        default: "0"
      loop:
        description: "循环轮数（0=只跑一次；默认 10 轮 × 30 分钟 ≈ 5 小时）"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: xau-klines
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 10 轮 × (30 分钟等待 + 约 2 分钟抓取) ≈ 320 分钟，留 25 分钟余量。
    # 上限 360 分钟是 GitHub 的硬顶，不能贴着设。
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 循环抓取（首轮含日文件，其后只补 tick）
        env:
          DAYS: ${{ github.event.inputs.days }}
          RETRY: ${{ github.event.inputs.retry }}
          REBUILD: ${{ github.event.inputs.rebuild }}
          LOOP: ${{ github.event.inputs.loop }}
        run: |
          set -u
          if [ -z "${DAYS:-}" ]; then DAYS=3; fi
          if [ -z "${LOOP:-}" ]; then LOOP=10; fi
          if [ "$LOOP" = "0" ]; then LOOP=1; fi

          git config user.name  "xau-klines-bot"
          git config user.email "bot@users.noreply.github.com"

          # 每轮都独立提交：页面读的是 main 上的产物，攒到最后一起推等于中间几小时白跑。
          # 被别的 bot 抢先推走时 rebase 重试，最多 3 次（与 jin10 的 */20 会撞车）。
          commit_push() {
            git add xau/klines.json
            if git diff --cached --quiet; then echo "无变化"; return 0; fi
            git commit -m "chore: xau klines $(date -u +'%m-%d %H:%M')"
            for k in 1 2 3; do
              if git push; then echo "push ok（第 $k 次）"; return 0; fi
              echo "::warning::push 被拒，rebase 后重试（第 $k 次）"
              git pull --rebase --autostash || true
            done
            echo "::warning::连续 3 次 push 失败，本轮产物未上线"
          }

          i=1
          while [ "$i" -le "$LOOP" ]; do
            echo "=== round $i/$LOOP · $(date -u +'%H:%M') UTC ==="
            if [ "$i" = "1" ]; then
              if [ "${RETRY:-0}" = "1" ]; then
                python3 tools/fetch_xau.py --retry-failed || true
              elif [ "${REBUILD:-0}" = "1" ]; then
                python3 tools/fetch_xau.py --days "$DAYS" --rebuild-daily || true
              else
                python3 tools/fetch_xau.py --days "$DAYS" || true
              fi
            else
              python3 tools/fetch_xau.py --ticks-only || true
            fi
            commit_push
            i=$((i + 1))
            if [ "$i" -le "$LOOP" ]; then
              # 分 6 段等待，每 5 分钟往日志打一行：长时间静默的 job 看起来像卡死，
              # 排查时也分不清「在等下一轮」还是「已经挂了」。
              w=0
              while [ "$w" -lt 6 ]; do
                sleep 300
                w=$((w + 1))
                echo "  等待下一轮 $((w * 5))/30 分钟"
              done
            fi
          done
          echo "循环结束，共 $((i - 1)) 轮"
