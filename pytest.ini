[pytest]
testpaths = tests
# -n 8：默认并行。每条用例都要起一次页面（≈0.6s 固定成本），904 条串行要 18 分钟，
# 8 进程约 4 分钟，12 进程约 2 分 52 秒。依赖 pytest-xdist（pip install pytest-xdist）。
# 串行调试时用 `pytest -n 0`，不要改这里。
addopts = -q --strict-markers -m "not deploy" -n 8
markers =
    smoke: 核心链路冒烟，19 条，目标 2 分钟内跑完
    slow: 单条超过 3 秒的用例
    deploy: 上线一致性门禁，需联网；默认排除，收尾时显式 `-m deploy` 跑
